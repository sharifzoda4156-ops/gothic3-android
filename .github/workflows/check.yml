name: Validate standalone-port preparation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-converter:
    name: Synthetic JAR conversion tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  build-upstream-sample:
    name: Compile upstream sample standalone MIDlet (no Gothic game files)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout fork build scripts
        uses: actions/checkout@v4
      - name: Checkout pinned J2ME Loader
        run: |
          git clone --recurse-submodules https://github.com/nikita36078/J2ME-Loader.git .work/J2ME-Loader
          git -C .work/J2ME-Loader checkout --detach 261c216c017e77391774ca10748c1229884cecd2
          git -C .work/J2ME-Loader submodule update --init --recursive
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned Android platform and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          if [ -z "$SDK_MANAGER" ]; then echo 'sdkmanager missing' >&2; exit 1; fi
          echo "Using $SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'
      - name: Assemble clean upstream midlet sample
        working-directory: .work/J2ME-Loader
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleMidletDebug
      - name: Compile mixed synthetic Java 46 and 52 bytecode through D8
        run: |
          python3 tools/create_legacy_fixture.py .work/J2ME-Loader/app/libs/synthetic-legacy.jar
          javap -verbose -classpath .work/J2ME-Loader/app/libs/synthetic-legacy.jar SyntheticOld SyntheticModern | grep 'major version:'
          sed -i '/^dependencies {/a\    implementation files("libs/synthetic-legacy.jar")' .work/J2ME-Loader/app/build.gradle
          cd .work/J2ME-Loader
          ./gradlew --no-daemon --stacktrace :app:assembleMidletDebug
      - name: Upload sample-only APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: j2me-loader-sample-midlet-apk
          path: .work/J2ME-Loader/app/build/outputs/apk/midlet/debug/*.apk
          if-no-files-found: error
          retention-days: 7
