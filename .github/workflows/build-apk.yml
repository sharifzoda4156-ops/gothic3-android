name: Build Gothic 3 Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Standalone Gothic 3 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Gothic icon generator
        run: python3 -m pip install 'Pillow==11.3.0'

      - name: Run Unit Tests
        run: python3 -m unittest discover -s tests -v

      - name: Generate Gothic G launcher icons
        run: python3 tools/generate_game_icons.py

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Audit HD sources and exercise actual game loaders
        run: |
          python3 tools/audit_hd_assets.py
          python3 tools/test_hd_routing.py

      - name: Install Android Platform 37 and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)
          if [ -z "$SDK_MANAGER" ]; then echo 'sdkmanager missing' >&2; exit 1; fi
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" --install 'platforms;android-37.0' 'build-tools;37.0.0' 'ndk;29.0.14206865'

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Test native joystick and first-launch preset
        run: ./gradlew :app:testMidletDebugUnitTest --stacktrace

      - name: Assemble Midlet Debug APK
        run: ./gradlew :app:assembleMidletDebug --stacktrace

      - name: Verify HD resources and resolver in the assembled APK
        run: |
          for apk in app/build/outputs/apk/midlet/debug/*.apk; do
            python3 tools/audit_hd_assets.py --apk "$apk"
          done

      - name: Verify Gothic branding and native controls are inside APK
        run: |
          set -euo pipefail
          for apk in app/build/outputs/apk/midlet/debug/*.apk; do
            python3 tools/verify_standalone_apk.py --apk "$apk"
            "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$apk" > /tmp/gothic_badging.txt
            grep -F "package: name='org.gothic3.fanport.debug'" /tmp/gothic_badging.txt
            grep -F "application-label:'Gothic 3: The Beginning'" /tmp/gothic_badging.txt
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Gothic_3_The_Beginning_HD_APK
          path: app/build/outputs/apk/midlet/debug/*.apk
          retention-days: 30
